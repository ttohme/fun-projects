# Raspberry Pi 4 — "the monitor"
# Observability and health: trace explorer + uptime dashboard.
# Keeps these off the Pi 5 so the brain stays focused on the pipeline.
#
#   docker compose -f infra/docker-compose.pi4.yml up -d
#
# The Pi 5's LiteLLM ships traces here via LANGFUSE_HOST (point it at this
# machine's tailnet hostname, e.g. http://pi4.tailnet.ts.net:3000).
# Configure Uptime Kuma monitors in the UI to watch the Pi 5 and Windows ports.
version: "3.9"

networks:
  ai-net:
    driver: bridge

volumes:
  langfuse_data:
  uptime_kuma_data:

services:

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    env_file: ./env/.env
    environment:
      DATABASE_URL: "file:/data/langfuse.db"
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET_KEY}
      # Set to this machine's tailnet URL so login links resolve from your phone,
      # e.g. http://pi4.tailnet.ts.net:3000
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL}
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - langfuse_data:/data
    networks: [ai-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/public/health"]
      interval: 20s
      timeout: 10s
      retries: 5

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks: [ai-net]
