# Raspberry Pi 4 — "the monitor"
# Observability and health: trace explorer + uptime dashboard.
# Keeps these off the Pi 5 so the brain stays focused on the pipeline.
#
# Run from the repo root WITH the env file flag — compose only interpolates
# ${VARS} from the shell or --env-file, never from a service's env_file:
#
#   docker compose --env-file infra/env/.env -f infra/docker-compose.pi4.yml up -d
#
# The Pi 5's LiteLLM ships traces here via LANGFUSE_HOST (point it at this
# machine's tailnet hostname, e.g. http://pi4.tailnet.ts.net:3000).
# Configure Uptime Kuma monitors in the UI to watch the Pi 5 and Windows ports.

networks:
  ai-net:
    driver: bridge

volumes:
  langfuse_db_data:
  uptime_kuma_data:

services:

  langfuse-db:
    # Langfuse v2 requires PostgreSQL (Prisma); it cannot run on SQLite.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    networks: [ai-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://langfuse:${POSTGRES_PASSWORD}@langfuse-db:5432/langfuse"
      SALT: ${LANGFUSE_SALT}
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET_KEY}
      # Set to this machine's tailnet URL so login links resolve from your phone,
      # e.g. http://pi4.tailnet.ts.net:3000
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL}
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"
    networks: [ai-net]
    depends_on:
      langfuse-db:
        condition: service_healthy
    healthcheck:
      # node:alpine base image has busybox wget, not curl.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/public/health"]
      interval: 20s
      timeout: 10s
      retries: 5

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks: [ai-net]
