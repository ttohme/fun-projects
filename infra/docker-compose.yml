version: "3.9"

networks:
  ai-net:
    driver: bridge

volumes:
  n8n_data:
  langfuse_data:
  redis_data:
  uptime_kuma_data:
  openhands_data:

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [ai-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    env_file: ./env/.env
    command: ["--config", "/app/litellm.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm.yaml:/app/litellm.yaml:ro
    networks: [ai-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 15s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    env_file: ./env/.env
    environment:
      DATABASE_URL: "file:/data/langfuse.db"
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET_KEY}
      NEXTAUTH_URL: "http://localhost:3000"
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - langfuse_data:/data
    networks: [ai-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/public/health"]
      interval: 20s
      timeout: 10s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    env_file: ./env/.env
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_LOG_LEVEL: info
      WEBHOOK_URL: ${N8N_WEBHOOK_BASE_URL}
      GENERIC_TIMEZONE: "UTC"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../apps/orchestrator/workflows:/opt/n8n-workflows:ro
    networks: [ai-net]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks: [ai-net]

  openhands:
    # WARNING: mounts Docker socket — restrict access to trusted users only
    image: ghcr.io/all-hands-ai/openhands:main
    restart: unless-stopped
    env_file: ./env/.env
    environment:
      LLM_MODEL: ${OPENHANDS_LLM_MODEL}
      LLM_API_KEY: ${OPENHANDS_LLM_API_KEY}
      LLM_BASE_URL: "http://litellm:4000"
      SANDBOX_RUNTIME_CONTAINER_IMAGE: docker.io/all-hands-ai/runtime:main
    ports:
      - "3333:3000"
    volumes:
      - openhands_data:/opt/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [ai-net]
    depends_on:
      litellm:
        condition: service_healthy
